[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
  APP_URL = "https://azari-microfinance.site"
  NETLIFY_FEEDBACK_DISABLED = "true"
  NETLIFY_DRAWER = "false"

# Redirection sous-domaine www vers domaine principal officiel
[[redirects]]
  from = "https://www.azari-microfinance.site/*"
  to = "https://azari-microfinance.site/:splat"
  status = 301
  force = true

# L'adaptateur OpenNext est détecté et maintenu automatiquement par Netlify.
# Ces routes financières ne doivent jamais être mises en cache par un CDN partagé.
[[headers]]
  for = "/client/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "private, no-store, max-age=0, must-revalidate"
    Netlify-CDN-Cache-Control = "no-store"

# Mise en cache immuable des bundles statiques (JS, CSS, polices)
# Évite toute ré-interrogation du serveur et réduit le compute/bande passante à 0
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
