name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Environnement GitHub à déployer
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: supabase-deploy-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'staging' }}
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      EXPECTED_PROJECT_NAME: ${{ vars.SUPABASE_PROJECT_NAME }}
      EXPECTED_ORGANIZATION_ID: ${{ vars.SUPABASE_ORGANIZATION_ID }}
      DEPLOYMENT_TARGET: ${{ inputs.target || 'staging' }}
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Verify explicit deployment target
        shell: bash
        run: |
          set -euo pipefail
          for variable in PROJECT_REF EXPECTED_PROJECT_NAME EXPECTED_ORGANIZATION_ID DB_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "Missing required GitHub environment configuration: $variable" >&2
              exit 1
            fi
          done
          if [[ ! "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "Invalid Supabase project reference format" >&2
            exit 1
          fi
          projects="$(supabase projects list --output json)"
          matches="$(jq --arg ref "$PROJECT_REF" '[.[] | select(.id == $ref)] | length' <<<"$projects")"
          if [ "$matches" -ne 1 ]; then
            echo "Configured project reference is not uniquely available to this token" >&2
            exit 1
          fi
          actual_name="$(jq -r --arg ref "$PROJECT_REF" '.[] | select(.id == $ref) | .name' <<<"$projects")"
          actual_org="$(jq -r --arg ref "$PROJECT_REF" '.[] | select(.id == $ref) | .organization_id' <<<"$projects")"
          if [ "$actual_name" != "$EXPECTED_PROJECT_NAME" ] || [ "$actual_org" != "$EXPECTED_ORGANIZATION_ID" ]; then
            echo "Supabase target identity mismatch for $DEPLOYMENT_TARGET" >&2
            exit 1
          fi
          echo "Verified Supabase $DEPLOYMENT_TARGET target: $actual_name ($PROJECT_REF)"

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"

      - name: Review pending migrations
        run: supabase db push --linked --password "$DB_PASSWORD" --dry-run

      - name: Apply migrations
        run: supabase db push --linked --password "$DB_PASSWORD"

      - name: Deploy Edge Functions through API
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api --jobs 4
