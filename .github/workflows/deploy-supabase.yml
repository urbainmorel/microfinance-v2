name: Deploy Supabase

on:
  workflow_run:
    workflows: ["Supabase tests"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: Environnement GitHub à déployer
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: supabase-deploy-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'staging' }}
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      EXPECTED_PROJECT_NAME: ${{ vars.SUPABASE_PROJECT_NAME }}
      EXPECTED_ORGANIZATION_ID: ${{ vars.SUPABASE_ORGANIZATION_ID }}
      DEPLOYMENT_TARGET: ${{ inputs.target || 'staging' }}
      OFFICIAL_PROJECT_REF: qdmriiokeindzgeokvqj
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - uses: denoland/setup-deno@v2
        if: github.event_name == 'workflow_dispatch'
        with:
          deno-version: v2.5.4

      # Un déclenchement manuel prouve lui-même l'état, tandis que le déploiement
      # automatique dépend déjà du workflow Supabase tests réussi sur le même SHA.
      - name: Rebuild and test database before manual deployment
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          supabase start
          trap 'supabase stop --no-backup' EXIT
          supabase db lint --local --level error

      - name: Check Edge Functions before manual deployment
        if: github.event_name == 'workflow_dispatch'
        run: |
          deno lint --config supabase/functions/deno.json supabase/functions
          deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

      - name: Verify explicit deployment target
        shell: bash
        run: |
          set -euo pipefail
          for variable in PROJECT_REF EXPECTED_PROJECT_NAME EXPECTED_ORGANIZATION_ID; do
            if [ -z "${!variable:-}" ]; then
              echo "Missing required GitHub environment configuration: $variable" >&2
              exit 1
            fi
          done
          if [[ ! "$PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "Invalid Supabase project reference format" >&2
            exit 1
          fi
          if [ "$PROJECT_REF" != "$OFFICIAL_PROJECT_REF" ]; then
            echo "Unauthorized Supabase target: this application only uses $OFFICIAL_PROJECT_REF" >&2
            exit 1
          fi
          projects="$(supabase projects list --output json)"
          matches="$(jq --arg ref "$PROJECT_REF" '[.[] | select(.id == $ref)] | length' <<<"$projects")"
          if [ "$matches" -ne 1 ]; then
            echo "Configured project reference is not uniquely available to this token" >&2
            exit 1
          fi
          actual_name="$(jq -r --arg ref "$PROJECT_REF" '.[] | select(.id == $ref) | .name' <<<"$projects")"
          actual_org="$(jq -r --arg ref "$PROJECT_REF" '.[] | select(.id == $ref) | .organization_id' <<<"$projects")"
          if [ "${actual_name,,}" = "coutilo" ]; then
            echo "Forbidden Supabase project: Coutilo never belongs to this application" >&2
            exit 1
          fi
          if [ "$actual_name" != "$EXPECTED_PROJECT_NAME" ] || [ "$actual_org" != "$EXPECTED_ORGANIZATION_ID" ]; then
            echo "Supabase target identity mismatch for $DEPLOYMENT_TARGET" >&2
            exit 1
          fi
          echo "Verified Supabase $DEPLOYMENT_TARGET target: $actual_name ($PROJECT_REF)"

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Review pending migrations
        run: supabase db push --linked --dry-run

      - name: Apply migrations
        run: supabase db push --linked

      - name: Deploy Edge Functions through API
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api --jobs 4
