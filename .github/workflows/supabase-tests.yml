name: Supabase tests

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-tests.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-tests.yml"

permissions:
  contents: read

concurrency:
  group: supabase-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: pgTAP migrations and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      # Docker is used only inside the GitHub-hosted runner, never locally.
      - name: Start Supabase in GitHub Actions
        run: supabase start

      - name: Run pgTAP tests
        run: supabase test db --local

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
