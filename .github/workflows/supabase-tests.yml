name: Supabase tests

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-tests.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-tests.yml"

permissions:
  contents: read

concurrency:
  group: supabase-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: pgTAP migrations and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      # Docker is used only inside the GitHub-hosted runner, never locally.
      - name: Start Supabase in GitHub Actions
        run: supabase start

      - name: Verify local migration history
        run: supabase migration list --local

      - name: Lint database schema
        run: supabase db lint --local --level error

      - name: Run pgTAP tests
        run: supabase test db --local

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  edge-functions:
    name: Deno checks for Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4

      - name: Lint Edge Functions
        run: deno lint --config supabase/functions/deno.json supabase/functions

      - name: Typecheck Edge Function entrypoints
        run: |
          deno check --config supabase/functions/deno.json \
            supabase/functions/client-command/index.ts \
            supabase/functions/daily-jobs/index.ts \
            supabase/functions/pin-recovery/index.ts \
            supabase/functions/send-notification-email/index.ts \
            supabase/functions/set-pin/index.ts \
            supabase/functions/verify-pin/index.ts
